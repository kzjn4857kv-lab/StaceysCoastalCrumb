<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6b351c">
<title>Stacey's Coastal Crumb | Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--brown:#6b351c;--tan:#c99652;--cream:#fffaf2;--blue:#3f7788;--ink:#30251f;--muted:#766b63;--line:#eadfd3;--white:#fff;--green:#2f6f4e;--red:#9b3d32}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--cream);color:var(--ink)}
.container{max-width:1200px;margin:auto;padding:20px}header{padding:20px 0}h1,h2{font-family:Georgia,serif;color:var(--brown);margin:0}h1{font-size:32px}.sub{color:var(--muted);margin-top:5px}.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 5px 18px rgba(70,45,25,.06)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#f4eadc;border-radius:12px;padding:14px}.metric strong{display:block;font-size:24px;color:var(--brown)}.metric span{font-size:12px;color:var(--muted)}
.toolbar{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:10px;align-items:end}label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}input,select{width:100%;padding:10px;border:1px solid #d9cec4;border-radius:9px;background:#fff;font:inherit}button{border:0;border-radius:9px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--brown);color:#fff}.secondary{background:#fff;border:1px solid var(--brown);color:var(--brown)}.danger{background:#fff;border:1px solid var(--red);color:var(--red)}
.table-wrap{overflow:auto}.orders{width:100%;border-collapse:collapse;min-width:1050px}.orders th,.orders td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.orders th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.customer{font-weight:800}.detail{font-size:12px;color:var(--muted);margin-top:3px;white-space:pre-line}.money{font-weight:800;color:var(--brown)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.new{background:#eee7dc}.progress{background:#dcebf0;color:#24596a}.complete{background:#dcecdf;color:#245f43}.unpaid{background:#f5dfdb;color:#8a3027}.partial{background:#f4eadc;color:#79521f}.paid{background:#dcecdf;color:#245f43}.hidden{display:none}.login{max-width:430px;margin:80px auto}.error{color:var(--red);font-size:13px;margin-top:10px}.success{color:var(--green);font-size:13px;margin-top:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.toolbar{grid-template-columns:1fr}.container{padding:12px}}
</style>
</head>
<body>
<div id="loginView" class="login card">
  <h1>Admin Login</h1>
  <p class="sub">Stacey's Coastal Crumb order management</p>
  <label for="email">Email</label><input id="email" type="email" autocomplete="username">
  <label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
  <button class="primary" style="width:100%;margin-top:14px" onclick="login()">Sign In</button>
  <div id="loginError" class="error"></div>
</div>

<div id="adminView" class="container hidden">
<header>
  <div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap">
    <div><h1>Stacey's Coastal Crumb — Orders</h1><div id="signedIn" class="sub"></div></div>
    <button class="secondary" onclick="logout()">Sign Out</button>
  </div>
</header>

<div class="grid">
  <div class="metric"><strong id="metricTotal">0</strong><span>Total Orders</span></div>
  <div class="metric"><strong id="metricNew">0</strong><span>New / In Progress</span></div>
  <div class="metric"><strong id="metricComplete">0</strong><span>Complete</span></div>
  <div class="metric"><strong id="metricOutstanding">$0.00</strong><span>Payment Outstanding</span></div>
</div>

<div class="card">
  <div class="toolbar">
    <div><label for="search">Search</label><input id="search" placeholder="Customer, phone, address..." oninput="render()"></div>
    <div><label for="statusFilter">Order Status</label><select id="statusFilter" onchange="render()"><option value="">All</option><option>New</option><option>In Progress</option><option>Complete</option></select></div>
    <div><label for="paymentFilter">Payment</label><select id="paymentFilter" onchange="render()"><option value="">All</option><option>Unpaid</option><option>Partial</option><option>Paid</option></select></div>
    <div><label for="weekFilter">Order Week</label><select id="weekFilter" onchange="render()"><option value="">All Weeks</option></select></div>
    <button class="primary" onclick="loadOrders()">Refresh</button>
  </div>
</div>

<div class="card"><div class="table-wrap"><table class="orders"><thead><tr>
<th>Customer</th><th>Order Week</th><th>Items / Inclusions</th><th>Total</th><th>Order Status</th><th>Payment</th><th>Payment Method</th><th>Actions</th>
</tr></thead><tbody id="ordersBody"></tbody></table></div><div id="message" class="small" style="margin-top:12px"></div></div>
</div>

<script>
const SUPABASE_URL="https://kexrxtydurzkbfwqerqr.supabase.co";
const SUPABASE_KEY="sb_publishable_yuxz9YQ22Oe0fwX60sl2Iw_Q_EaoRcx";
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let orders=[];
let busy=false;
function esc(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
function money(n){return "$"+Number(n||0).toFixed(2)}
function statusClass(s){return s==="Complete"?"complete":s==="In Progress"?"progress":"new"}
function paymentClass(s){return s==="Paid"?"paid":s==="Partial"?"partial":"unpaid"}
async function login(){
  const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
  const box=document.getElementById("loginError");box.textContent="";
  const {data,error}=await db.auth.signInWithPassword({email,password});
  if(error){box.textContent=error.message;return}
  await showAdmin(data.user);
}
async function logout(){await db.auth.signOut();document.getElementById("adminView").classList.add("hidden");document.getElementById("loginView").classList.remove("hidden")}
async function showAdmin(user){
  const {data:admin,error}=await db.from("admin_users").select("user_id").eq("user_id",user.id).maybeSingle();
  if(error||!admin){await db.auth.signOut();document.getElementById("loginError").textContent="This account is not authorized for the admin page.";return}
  document.getElementById("loginView").classList.add("hidden");document.getElementById("adminView").classList.remove("hidden");document.getElementById("signedIn").textContent="Signed in as "+user.email;await loadOrders();
}
async function loadOrders(){
  if(busy)return;busy=true;document.getElementById("message").textContent="Loading orders...";
  const {data,error}=await db.from("orders").select("*").order("pickup_date",{ascending:true}).order("created_at",{ascending:false});
  busy=false;
  if(error){document.getElementById("message").textContent=error.message;return}
  orders=data||[];populateWeekFilter();updateMetrics();render();document.getElementById("message").textContent=orders.length?"":"No orders found.";
}
function updateMetrics(){
  const visible=filtered();
  document.getElementById("metricTotal").textContent=visible.length;
  document.getElementById("metricNew").textContent=visible.filter(o=>o.status!=="Complete").length;
  document.getElementById("metricComplete").textContent=visible.filter(o=>o.status==="Complete").length;
  const outstanding=visible.reduce((s,o)=>s+Math.max(0,Number(o.total_amount||0)-Number(o.payment_amount||0)),0);
  document.getElementById("metricOutstanding").textContent=money(outstanding);
}
function populateWeekFilter(){
  const select=document.getElementById("weekFilter");
  const current=select.value;
  const weeks=[...new Set(orders.map(o=>o.pickup_date).filter(Boolean))].sort();
  select.innerHTML='<option value="">All Weeks</option>'+weeks.map(w=>`<option value="${esc(w)}">Week of ${esc(formatWeek(w))}</option>`).join("");
  if(weeks.includes(current)) select.value=current;
}
function formatWeek(value){
  const d=new Date(value+"T12:00:00");
  if(Number.isNaN(d.getTime())) return value;
  return d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
}
function filtered(){
  const q=document.getElementById("search").value.trim().toLowerCase(),sf=document.getElementById("statusFilter").value,pf=document.getElementById("paymentFilter").value,wf=document.getElementById("weekFilter").value;
  return orders.filter(o=>{
    const hay=[o.customer_name,o.phone,o.customer_address,o.items,o.inclusion,o.notes].join(" ").toLowerCase();
    return (!q||hay.includes(q))&&(!sf||o.status===sf)&&(!pf||o.payment_status===pf)&&(!wf||o.pickup_date===wf);
  });
}
function render(){
  updateMetrics();
  const body=document.getElementById("ordersBody");
  body.innerHTML=filtered().map(o=>{
    const total=Number(o.total_amount||0),paid=Number(o.payment_amount||0),due=Math.max(0,total-paid);
    return `<tr>
      <td><div class="customer">${esc(o.customer_name)}</div><div class="detail">${esc(o.phone)}\n${esc(o.customer_address)}</div></td>
      <td>${esc(o.pickup_date||"")}</td>
      <td><div class="detail">${esc(o.items||"")}</div>${o.inclusion?`<div class="detail"><strong>Inclusions:</strong>\n${esc(o.inclusion)}</div>`:""}${o.notes?`<div class="detail"><strong>Notes:</strong> ${esc(o.notes)}</div>`:""}</td>
      <td><div class="money">${money(total)}</div><div class="detail">${esc(o.quantity||0)} loaves</div></td>
      <td><span class="pill ${statusClass(o.status)}">${esc(o.status||"New")}</span><select style="margin-top:7px" onchange="changeStatus('${o.id}',this.value)"><option ${o.status==="New"?"selected":""}>New</option><option ${o.status==="In Progress"?"selected":""}>In Progress</option><option ${o.status==="Complete"?"selected":""}>Complete</option></select></td>
      <td><span class="pill ${paymentClass(o.payment_status)}">${esc(o.payment_status||"Unpaid")}</span><div class="detail">Paid: ${money(paid)}<br>Due: ${money(due)}</div></td>
      <td><select onchange="changePayment('${o.id}',this.value)"><option value="">Select method</option><option ${o.payment_method==="ApplePay"?"selected":""}>ApplyPay</option><option ${o.payment_method==="Cash"?"selected":""}>Cash</option><option ${o.payment_method==="Venmo"?"selected":""}>Venmo</option><option ${o.payment_method==="Zelle"?"selected":""}>Zelle</option><option ${o.payment_method==="Card"?"selected":""}>Card</option><option ${o.payment_method==="Other"?"selected":""}>Other</option></select></td>
      <td><div class="actions"><button class="secondary" onclick="recordPayment('${o.id}',${total})">Record Payment</button></div></td>
    </tr>`;
  }).join("");
}
async function updateOrder(id,patch){
  const {data,error}=await db.from("orders").update(patch).eq("id",id).select("*").single();
  if(error){alert(error.message);return false}
  const idx=orders.findIndex(o=>String(o.id)===String(id));if(idx>=0)orders[idx]=data;updateMetrics();render();return true;
}
async function changeStatus(id,value){await updateOrder(id,{status:value})}
async function changePayment(id,value){await updateOrder(id,{payment_method:value||null})}
async function recordPayment(id,total){
  const o=orders.find(x=>String(x.id)===String(id));if(!o)return;
  const current=Number(o.payment_amount||0),suggested=Math.max(0,Number(total)-current);
  const entered=prompt(`Payment received for ${o.customer_name}.\nOrder total: ${money(total)}\nAlready paid: ${money(current)}\nEnter amount received:`,suggested.toFixed(2));
  if(entered===null)return;
  const amount=Number(entered);if(!Number.isFinite(amount)||amount<0){alert("Please enter a valid payment amount.");return}
  const newPaid=Math.min(Number(total),current+amount);const status=newPaid<=0?"Unpaid":newPaid+0.001>=Number(total)?"Paid":"Partial";
  await updateOrder(id,{payment_amount:newPaid,payment_status:status,paid_at:status==="Paid"?new Date().toISOString():o.paid_at});
}
db.auth.getSession().then(({data})=>{if(data.session)showAdmin(data.session.user)});
db.auth.onAuthStateChange((_event,session)=>{if(session&&!document.getElementById("adminView").classList.contains("hidden")){} });
</script>
</body>
</html>
